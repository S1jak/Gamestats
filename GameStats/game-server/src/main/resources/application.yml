server:
  port: 8080

spring:
  application:
    name: GameStats
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # 数据源（MySQL game_stats 库，createDatabaseIfNotExist=true 自动建库）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/game_stats?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  # 启动时自动执行建表 + 种子数据（CREATE TABLE IF NOT EXISTS / ON DUPLICATE KEY 保证幂等）
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lxw.pojo.entity
  configuration:
    # 列名 snake_case → 属性 camelCase 自动映射
    map-underscore-to-camel-case: true

game:
  jwt:
    # 签名密钥（生产环境应通过环境变量注入）
    secret-key: GameStatsSecretKey2024GameStatsSecretKey2024
    # 过期时间：7 天（毫秒）
    ttl: 604800000
    # token 在请求头 / query 参数中的名称
    token-name: token
  upload:
    # 头像本地存储目录
    path: ./uploads

logging:
  level:
    com.lxw: info
